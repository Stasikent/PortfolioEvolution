services:
  api:
    build:
      context: ./backend
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: portfolio_knowledge
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.vsegpt.ru/v1}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-4o-mini}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-${LLM_API_KEY:-}}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.vsegpt.ru/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      COURSEWORK_CACHE_DIR: /data/coursework
      DRIVE_BATCH_SIZE: ${DRIVE_BATCH_SIZE:-32}
      CHAT_RATE_MINUTE: ${CHAT_RATE_MINUTE:-10}
      CHAT_RATE_HOUR: ${CHAT_RATE_HOUR:-60}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - coursework_cache:/data/coursework
    depends_on:
      qdrant:
        condition: service_started

  coursework-sync:
    build:
      context: ./backend
    profiles: ["coursework-sync"]
    command: ["/bin/sh", "-c", "while true; do /bin/sh /app/scripts/sync-coursework.sh || true; sleep $${COURSEWORK_SYNC_INTERVAL_SECONDS:-21600}; done"]
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: portfolio_knowledge
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-${LLM_API_KEY:-}}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.vsegpt.ru/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      COURSEWORK_CACHE_DIR: /data/coursework
      DRIVE_BATCH_SIZE: ${DRIVE_BATCH_SIZE:-32}
      COURSEWORK_SYNC_INTERVAL_SECONDS: ${COURSEWORK_SYNC_INTERVAL_SECONDS:-21600}
      GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID:-}
      GOOGLE_DRIVE_ACCESS_TOKEN: ${GOOGLE_DRIVE_ACCESS_TOKEN:-}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${GOOGLE_DRIVE_REFRESH_TOKEN:-}
      GOOGLE_DRIVE_CLIENT_ID: ${GOOGLE_DRIVE_CLIENT_ID:-}
      GOOGLE_DRIVE_CLIENT_SECRET: ${GOOGLE_DRIVE_CLIENT_SECRET:-}
    volumes:
      - coursework_cache:/data/coursework
    depends_on:
      qdrant:
        condition: service_started
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
  coursework_cache:
