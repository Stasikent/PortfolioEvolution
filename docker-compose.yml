services:
  api:
    build:
      context: ./backend
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: portfolio_knowledge
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.vsegpt.ru/v1}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-4o-mini}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-${LLM_API_KEY:-}}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.vsegpt.ru/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_started

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
